<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian Vow 상영관</title>
<meta name="description" content="졸업작품 3D 애니메이션 상영 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 흐름: 오프닝 → 매표소(자동 발권) → 상영관(커튼) → 크레딧 → 캐릭터 전시실 */
  --ink:#100c0e;
  --velvet:#6a1625;
  --brass:#e3c48e;
  --paper:#f1e8d6;
  --smoke:#9a9096;
  --line:#2c2428;
  --display:"Bodoni Moda","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
img{max-width:100%}

.nav{position:fixed;inset:0 auto auto 0;z-index:50;padding:14px 20px;display:none}
body[data-view="credits"] .nav,body[data-view="character"] .nav{display:block}
.nav a{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;text-decoration:none}
.nav img{height:28px;width:auto}

main{height:100%}
.view{position:absolute;inset:0;overflow-y:auto;padding:76px 20px 48px;display:none}
.view.active{display:block;animation:fadeIn .8s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{max-width:1080px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:2px;border:1px solid var(--brass);background:var(--brass);color:var(--ink);font-weight:600;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--paper);border-color:#4a3e44}
.btn.ghost:hover{border-color:var(--brass)}
.fader{position:fixed;inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .9s ease}
.fader.on{opacity:1}

/* 커튼 공통 */
.curtain{position:absolute;top:0;bottom:0;width:50.5%;z-index:3;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.38) 0 16px,rgba(255,255,255,.05) 16px 24px,rgba(0,0,0,.22) 24px 44px),
  linear-gradient(#7a1a2b,#3c0b14 85%);box-shadow:inset 0 -80px 100px rgba(0,0,0,.55)}
.curtain.l{left:0;transform-origin:left center}
.curtain.r{right:0;transform-origin:right center}
.valance{position:absolute;top:0;left:0;right:0;height:56px;z-index:4;background:linear-gradient(#4a0f1a,var(--velvet));border-bottom:2px solid var(--brass)}
.valance::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:radial-gradient(circle at 50% 0,var(--velvet) 15px,transparent 16px) 0 0/34px 18px repeat-x}

/* ---------- 오프닝 ---------- */
#opening{padding:0;overflow:hidden;background:radial-gradient(ellipse 60% 55% at 50% 45%,#2a1a1f 0%,var(--ink) 70%)}
#opening.active{display:grid;place-items:center}
#opening .curtain.l{animation:openL 2.4s cubic-bezier(.7,0,.2,1) .4s forwards}
#opening .curtain.r{animation:openR 2.4s cubic-bezier(.7,0,.2,1) .4s forwards}
@keyframes openL{to{transform:translateX(-92%) scaleX(.6)}}
@keyframes openR{to{transform:translateX(92%) scaleX(.6)}}
.stage{position:relative;z-index:2;text-align:center;display:grid;gap:22px;justify-items:center;padding:80px 20px}
.beam{position:absolute;left:50%;top:-30%;width:900px;height:160%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 165deg,rgba(241,232,214,.07) 175deg,rgba(241,232,214,.12) 180deg,rgba(241,232,214,.07) 185deg,transparent 195deg);pointer-events:none;z-index:1;animation:flicker 4s infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:.85}50%{opacity:1}52%{opacity:.9}}
.logo-box{width:min(440px,80vw);aspect-ratio:16/9;display:grid;place-items:center;opacity:0;transform:scale(.94);animation:rise 1.6s ease 2.2s forwards;filter:drop-shadow(0 0 40px rgba(209,168,94,.25))}
.logo-box img{max-height:100%;object-fit:contain}
@keyframes rise{to{opacity:1;transform:none}}
.stage .meta{opacity:0;animation:rise 1s ease 3.2s forwards;display:grid;gap:6px}
.stage .meta p{margin:0;color:var(--smoke)}
.stage .cta{opacity:0;animation:rise 1s ease 3.8s forwards;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- 매표소 (자동 발권) ---------- */
#ticket{background:radial-gradient(ellipse 50% 45% at 50% 25%,#2a1a12 0%,var(--ink) 75%);padding-top:28px;padding-bottom:20px}
#ticket.active{display:grid;justify-items:center;align-content:start;gap:14px}
:root{--tw:min(78vw,calc((100dvh - 170px) * .533),440px)}
.machine{display:grid;justify-items:center;width:calc(var(--tw) + 70px)}
.machine .plate{width:100%;padding:12px 18px 20px;background:linear-gradient(#2c211c,#1a1316);border:1px solid #3e3128;border-radius:6px 6px 0 0;text-align:center}
.machine .plate span{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--brass)}
.slot{width:calc(var(--tw) + 30px);height:14px;margin-top:-7px;background:#050304;border:1px solid #3a2f34;border-radius:7px;box-shadow:inset 0 4px 8px #000;position:relative;z-index:2}
.clip{width:calc(var(--tw) + 60px);overflow:hidden;margin-top:-7px;padding:0 30px 30px}
.tk{position:relative;width:var(--tw);aspect-ratio:900/1688;transform:translateY(-102%);perspective:1600px;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6))}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.45,.05,.25,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  --r:calc(var(--tw) * .022);--s:calc(var(--tw) * .066);
  -webkit-mask:radial-gradient(circle var(--r) at 50% 0,#0000 96%,#000) 50% 0/var(--s) 51% repeat-x,radial-gradient(circle var(--r) at 50% 100%,#0000 96%,#000) 50% 100%/var(--s) 51% repeat-x;
  mask:radial-gradient(circle var(--r) at 50% 0,#0000 96%,#000) 50% 0/var(--s) 51% repeat-x,radial-gradient(circle var(--r) at 50% 100%,#0000 96%,#000) 50% 100%/var(--s) 51% repeat-x}
.face img,.face>div{display:block;width:100%;height:100%;object-fit:cover}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,240,210,.22) 48%,transparent 60%);transform:translateX(-120%);pointer-events:none}
#ticket.printing .tk{animation:printOut 3s cubic-bezier(.35,.05,.2,1) .4s forwards}
@keyframes printOut{0%{transform:translateY(-102%)}18%{transform:translateY(-84%)}30%{transform:translateY(-82%)}100%{transform:translateY(0)}}
#ticket.shine .face.front::after{animation:shine 1.2s ease forwards}
#ticket.back .flip{transform:rotateY(180deg) scale(1.03)}
#ticket.back .face.back::after{animation:shine 1.2s ease .9s forwards}
#ticket.round .flip{transform:rotateY(360deg)}
@keyframes shine{to{transform:translateX(120%)}}
#ticket.taken .tk{animation:takeAway 1.1s cubic-bezier(.5,0,.7,.4) forwards}
@keyframes takeAway{0%{transform:translateY(0)}25%{transform:translateY(-8px) rotate(-1deg)}100%{transform:translateY(70vh) rotate(-8deg) scale(.9);opacity:0}}
.tk-status{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--smoke);min-height:1.6em;text-align:center;margin:0}
.tk-status b{color:var(--brass);font-weight:400}
.tk-skip{position:fixed;right:18px;bottom:16px;font-size:13px;color:#6d6368;text-decoration:none}
.tk-skip:hover{color:var(--paper)}

/* 기본 티켓 (티켓 이미지가 없을 때) */
.tk-default{display:grid;grid-template-rows:1fr auto;background:var(--paper);color:#241a1d;position:relative}
.tk-main{padding:28px 24px;border-bottom:2px dashed #b9ab92;align-content:start;display:grid;gap:12px}
.tk-main .ev{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--velvet)}
.tk-main h3{font-size:26px}
.tk-grid{display:grid;grid-template-columns:1fr;gap:8px 16px}
.tk-grid div{display:grid}
.tk-grid small{font-size:10px;letter-spacing:.12em;color:#7a6b62;font-family:var(--mono)}
.tk-grid b{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tk-stub{padding:18px 12px;display:grid;gap:8px;align-content:space-between;justify-items:center;text-align:center}
.tk-stub .admit{font-family:var(--display);font-weight:900;font-size:22px;color:var(--velvet);line-height:1}
.tk-stub canvas{width:100%;height:56px}
.tk-stub code{font-family:var(--mono);font-size:11px}

/* ---------- 상영관 (커튼) ---------- */
#screening{padding:0;overflow:hidden;background:#000}
#screening.active{display:block}
.theater{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse 70% 60% at 50% 55%,#1c1013 0%,#000 75%);transition:background 2s}
.theater .curtain{transition:transform 2.8s cubic-bezier(.65,0,.25,1),filter 2s}
.theater.open .curtain.l{transform:translateX(-4%) scaleX(.1)}
.theater.open .curtain.r{transform:translateX(4%) scaleX(.1)}
.theater.dim{background:#000}
.theater.dim .curtain,.theater.dim .valance{filter:brightness(.35)}
.spot{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse 30% 45% at 50% 55%,rgba(255,220,170,.18),transparent 70%);transition:opacity 1.6s}
.theater.open .spot{opacity:0}
.screen{position:relative;z-index:1;width:min(90vw,calc((100% - 150px) * 16 / 9));width:min(90vw,calc((100dvh - 150px) * 16 / 9));aspect-ratio:16/9;margin-top:30px;background:#000;box-shadow:0 0 0 1px #1a1215,0 0 140px rgba(209,168,94,.08)}
.screen video,.screen iframe,.screen #yt{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.screen .notice{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--smoke);padding:20px}
.screen .notice strong{display:block;font-family:var(--display);font-size:24px;color:var(--paper);margin-bottom:6px}
.play-overlay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,0,0,.45);border:0;color:var(--paper)}
.play-overlay span{width:84px;height:84px;border-radius:50%;border:1px solid var(--brass);display:grid;place-items:center;font-size:26px;color:var(--brass)}
.skip{position:absolute;right:18px;bottom:16px;z-index:6;font-size:13px;color:#6d6368;text-decoration:none;transition:color .3s}
.skip:hover{color:var(--paper)}

/* ---------- 크레딧 ---------- */
.credits-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding:24px 0 36px;border-bottom:1px solid var(--line)}
.credits-hero h2{font-size:clamp(32px,5vw,56px);margin:10px 0 14px}
.lede{color:var(--smoke);max-width:60ch;margin:0 0 24px}
.credits-hero dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0;align-content:start;font-size:15px}
.credits-hero dt{color:var(--smoke);font-family:var(--mono);font-size:12px;letter-spacing:.1em;padding-top:3px}
.credits-hero dd{margin:0}
.c-section{display:grid;grid-template-columns:200px 1fr;gap:32px;padding:32px 0;border-bottom:1px solid var(--line)}
.c-section h3{font-size:20px;color:var(--brass)}
.c-section h3 small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--smoke);font-weight:400;margin-top:4px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.person{border:1px solid var(--line);background:#161114;padding:20px;display:grid;gap:10px;align-content:start}
.person .name{font-family:var(--display);font-size:20px;font-weight:700}
.person .roles{display:flex;flex-wrap:wrap;gap:6px}
.person .roles span{font-size:12px;padding:3px 8px;border:1px solid #3a2f34;border-radius:999px}
.person ul{margin:0;padding-left:18px;color:var(--smoke);font-size:14px;display:grid;gap:4px}
.end-links{display:flex;gap:10px;flex-wrap:wrap;padding:36px 0 0}
.roll{position:fixed;inset:0;z-index:80;background:#000;display:none;overflow:hidden}
.roll.on{display:block}
.roll-inner{position:absolute;left:0;right:0;top:100%;text-align:center;display:grid;gap:44px;padding:0 20px 40vh}
.roll-inner .r-dept{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--brass);margin-bottom:10px}
.roll-inner .r-name{font-family:var(--display);font-size:22px}
.roll-inner .r-role{color:var(--smoke);font-size:14px}
.roll .close{position:absolute;top:16px;right:16px;z-index:2}

/* ---------- 캐릭터 ---------- */
#character{padding:0;overflow:hidden}
#character.active{display:grid;grid-template-columns:320px 1fr}
.c-panel{padding:84px 24px 24px;border-right:1px solid var(--line);overflow-y:auto;display:grid;gap:22px;align-content:start;background:#130e11}
.c-panel h2{font-size:30px;margin-top:6px}
.c-panel p{margin:0;color:var(--smoke);font-size:15px}
.tabs{display:grid;gap:6px}
.tabs button{text-align:left;background:#1a1316;border:1px solid #3a2f34;color:var(--paper);padding:10px 14px;border-radius:2px;display:flex;justify-content:space-between}
.tabs button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.tool-row{display:flex;flex-wrap:wrap;gap:6px}
.tool-row button,.tool-row a{background:transparent;border:1px solid #3a2f34;color:var(--paper);padding:8px 12px;border-radius:2px;font-size:13px;text-decoration:none}
.tool-row button:hover,.tool-row a:hover{border-color:var(--brass)}
.tool-row button[aria-pressed="true"]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.panel-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--smoke);margin-bottom:8px}
.viewport{position:relative;min-height:0}
.viewport canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.viewport canvas:active{cursor:grabbing}
.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font-size:13px;color:var(--smoke);background:rgba(16,12,14,.7);padding:8px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
.angle{position:absolute;right:20px;top:24px;font-family:var(--mono);font-size:12px;color:var(--smoke);text-align:right;font-variant-numeric:tabular-nums}
.angle b{display:block;font-size:28px;color:var(--paper);font-weight:400}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--smoke);font-size:14px;pointer-events:none}

@media (max-width:820px){
  .credits-hero,.c-section{grid-template-columns:1fr;gap:20px}
  #character.active{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .c-panel{padding:64px 16px 16px;border-right:none;border-bottom:1px solid var(--line);gap:14px}
  .c-panel .hide-sm{display:none}
  .tabs{grid-auto-flow:column;overflow-x:auto}
  .tk-grid{grid-template-columns:repeat(2,1fr)}
  .view{padding-left:16px;padding-right:16px}
  .hint{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>

<header class="nav"><a href="#opening"><img id="navLogo" alt=""><span id="navTitle"></span></a></header>

<main>
  <!-- 오프닝 -->
  <section class="view" id="opening" aria-label="오프닝">
    <div class="valance"></div>
    <div class="curtain l"></div><div class="curtain r"></div>
    <div class="beam"></div>
    <div class="stage">
      <div class="logo-box"><img id="mainLogo" alt="작품 로고"></div>
      <div class="meta">
        <span class="eyebrow" id="opEvent"></span>
        <p id="opSub"></p>
      </div>
      <div class="cta">
        <a class="btn" href="#ticket">티켓 발권하기</a>
        <a class="btn ghost" href="#character">캐릭터 보기</a>
      </div>
    </div>
  </section>

  <!-- 매표소 -->
  <section class="view" id="ticket" aria-label="티켓 발권">
    <div class="machine">
      <div class="plate"><span>TICKET · 매표소</span></div>
      <div class="slot" aria-hidden="true"></div>
      <div class="clip"><div class="tk" id="tk"><div class="flip" id="flip"></div></div></div>
    </div>
    <p class="tk-status" id="tkStatus" aria-live="polite"></p>
    <a class="tk-skip" href="#screening">건너뛰기 →</a>
  </section>

  <!-- 상영관 -->
  <section class="view" id="screening" aria-label="상영관">
    <div class="theater" id="theater">
      <div class="screen" id="screen"></div>
      <div class="spot"></div>
      <div class="valance"></div>
      <div class="curtain l"></div><div class="curtain r"></div>
      <a class="skip" href="#credits">크레딧으로 건너뛰기 →</a>
    </div>
  </section>

  <!-- 크레딧 -->
  <section class="view" id="credits" aria-label="크레딧">
    <div class="wrap">
      <div class="credits-hero">
        <div>
          <span class="eyebrow">Credits · 만든 사람들</span>
          <h2 id="crTitle"></h2>
          <p class="lede" id="crSynopsis"></p>
          <button class="btn" id="rollBtn" type="button">엔딩 크레딧처럼 보기 ▶</button>
        </div>
        <dl id="crInfo"></dl>
      </div>
      <div id="crBody"></div>
      <div class="end-links">
        <a class="btn" href="#character">캐릭터 보러 가기</a>
        <a class="btn ghost" href="#opening">처음으로</a>
      </div>
    </div>
  </section>

  <!-- 캐릭터 -->
  <section class="view" id="character" aria-label="캐릭터 뷰어">
    <aside class="c-panel">
      <div>
        <span class="eyebrow">Character</span>
        <h2 id="chName"></h2>
      </div>
      <p id="chDesc"></p>
      <div>
        <div class="panel-label">캐릭터</div>
        <div class="tabs" id="chTabs"></div>
      </div>
      <div>
        <div class="panel-label">시점</div>
        <div class="tool-row">
          <button type="button" data-view="0">정면</button>
          <button type="button" data-view="90">측면</button>
          <button type="button" data-view="180">후면</button>
          <button type="button" data-view="top">위</button>
          <button type="button" id="resetCam">처음으로</button>
        </div>
      </div>
      <div>
        <div class="panel-label">보기</div>
        <div class="tool-row">
          <button type="button" id="autoRot" aria-pressed="true">자동 회전</button>
          <button type="button" id="lightBtn" aria-pressed="false">림 라이트</button>
          <button type="button" id="wireBtn" aria-pressed="false">와이어프레임</button>
        </div>
      </div>
      <div class="tool-row hide-sm">
        <a href="#credits">← 크레딧</a>
        <a href="#opening">처음 화면</a>
      </div>
    </aside>
    <div class="viewport" id="viewport">
      <div class="loading" id="loading">모델 불러오는 중…</div>
      <div class="angle" aria-live="off">회전 각도<b id="angleOut">0°</b></div>
      <div class="hint">드래그해서 돌리기 · 휠/핀치로 확대</div>
    </div>
  </section>
</main>

<div class="roll" id="roll" role="dialog" aria-label="엔딩 크레딧">
  <button class="btn ghost close" id="rollClose" type="button">닫기</button>
  <div class="roll-inner" id="rollInner"></div>
</div>
<div class="fader" id="fader"></div>

<script>document.write('<script src="content.js?v=' + Date.now() + '"><\/script>');</script>
<script>
const C = window.CONFIG;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const fade = async (on, ms = 900) => { $("#fader").classList.toggle("on", on); await wait(ms); };

/* ---------- 로고 ---------- */
function fallbackLogo(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d79a"/><stop offset="1" stop-color="#a87a36"/></linearGradient></defs>
    <g fill="none" stroke="url(#g)" stroke-width="2"><path d="M320 40 L360 90 L320 140 L280 90Z"/><circle cx="320" cy="90" r="64" opacity=".5"/></g>
    <text x="320" y="230" text-anchor="middle" font-family="Noto Serif KR, serif" font-weight="900" font-size="72" fill="url(#g)">${esc(C.title)}</text>
    <text x="320" y="280" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="10" fill="#d1a85e">${esc(C.titleEn).toUpperCase()}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function setLogo(img){ img.onerror = () => { img.onerror = null; img.src = fallbackLogo(); }; img.src = C.logo || fallbackLogo(); }
setLogo($("#mainLogo")); setLogo($("#navLogo"));
$("#navTitle").textContent = C.title;
$("#opEvent").textContent = C.event;
$("#opSub").textContent = C.subtitle;

/* ---------- 라우팅 ---------- */
const VIEWS = ["opening","ticket","screening","credits","character"];
let runId = 0;
function route(){
  const id = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "opening";
  runId++;
  document.body.dataset.view = id;
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === id));
  $("#fader").classList.remove("on");
  if (id !== "screening") stopFilm();
  if (id === "opening") restartOpening();
  if (id === "ticket") runTicket(runId);
  if (id === "screening") runScreening(runId);
  if (id === "character" && window.initViewer) window.initViewer();
}
addEventListener("hashchange", route);
function restartOpening(){
  document.querySelectorAll("#opening .curtain,#opening .logo-box,#opening .meta,#opening .cta").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
}

/* ---------- 티켓 ---------- */
function drawBarcode(cv, text){
  const x = cv.getContext("2d"); x.fillStyle = "#241a1d";
  let s = 2166136261; for (const ch of text) s = Math.imul(s ^ ch.charCodeAt(0), 16777619) >>> 0; s ||= 1;
  for (let px = 4; px < cv.width - 4;){ s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; const w = 1 + s % 3; if ((s >>> 4) % 3) x.fillRect(px, 0, w, cv.height); px += w + 1; }
}
function defaultTicket(){
  const T = C.ticket || {}, d = new Date(), p = n => String(n).padStart(2, "0");
  const no = `No.${p(d.getMonth()+1)}${p(d.getDate())}-${String(Math.floor(Math.random()*10000)).padStart(4,"0")}`;
  const el = document.createElement("div"); el.className = "tk-default";
  el.innerHTML = `<div class="tk-main"><span class="ev">${esc(C.event)}</span><h3>${esc(C.title)}</h3>
    <div class="tk-grid"><div><small>상영관</small><b>${esc(T.hall || "")}</b></div><div><small>일자</small><b>${p(d.getMonth()+1)}.${p(d.getDate())}</b></div><div><small>러닝타임</small><b>${esc(T.runtime || "")}</b></div></div></div>
    <div class="tk-stub"><span class="admit">ADMIT<br>ONE</span><canvas width="200" height="70"></canvas><code>${no}</code></div>`;
  drawBarcode(el.querySelector("canvas"), no);
  return el;
}
const flip = $("#flip");
(function buildTicket(){
  const T = C.ticket || {};
  const front = T.front || T.image, back = T.back;
  const face = (cls, src) => {
    const f = document.createElement("div"); f.className = "face " + cls;
    if (src){ const img = new Image(); img.alt = cls === "front" ? "티켓 앞면" : "티켓 뒷면"; img.src = src; img.onerror = () => { img.remove(); f.append(defaultTicket()); }; f.append(img); }
    else f.append(defaultTicket());
    flip.append(f);
  };
  face("front", front); face("back", back);
})();
async function runTicket(id){
  const v = $("#ticket"), st = $("#tkStatus");
  const ok = () => id === runId;
  v.classList.remove("printing", "shine", "back", "round", "taken");
  flip.style.transition = "none"; void v.offsetWidth; flip.style.transition = "";
  st.textContent = "티켓을 발권하고 있습니다";
  v.classList.add("printing");
  await wait(3500); if (!ok()) return;
  v.classList.add("shine");
  st.innerHTML = "발권 완료";
  await wait(1100); if (!ok()) return;
  v.classList.add("back");
  await wait(3000); if (!ok()) return;
  v.classList.add("round");
  st.innerHTML = "<b>" + esc((C.ticket && C.ticket.hall) || "상영관") + "</b>으로 입장합니다";
  await wait(2000); if (!ok()) return;
  v.classList.add("taken");
  await wait(700); if (!ok()) return;
  await fade(true);
  if (ok()) location.hash = "screening";
}

/* ---------- 상영관 ---------- */
const theater = $("#theater"), screen = $("#screen");
const ytId = (u => { const m = String(u || "").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m && m[1]; })(C.video);
let film = null, yt = null, ytReady = null;

if (ytId){
  ytReady = new Promise(res => { window.onYouTubeIframeAPIReady = res; });
  const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.append(sc);
} else if (C.video){
  film = document.createElement("video");
  film.src = C.video; film.playsInline = true; film.preload = "auto";
  film.addEventListener("ended", onFilmEnd);
  film.addEventListener("error", () => notice("영상을 불러오지 못했습니다", "영상 파일 경로를 확인해 주세요."));
  screen.append(film);
} else {
  notice("상영 준비 중입니다", "곧 공개됩니다.");
}
function notice(title, text){ screen.innerHTML = `<div class="notice"><div><strong>${esc(title)}</strong>${esc(text)}</div></div>`; }

function playButton(start){
  const b = document.createElement("button"); b.className = "play-overlay"; b.type = "button";
  b.innerHTML = "<span aria-hidden=\"true\">▶</span>"; b.setAttribute("aria-label", "재생");
  b.onclick = () => { b.remove(); start(); };
  screen.append(b);
}
async function startFilm(){
  theater.classList.add("dim");
  if (film){
    film.controls = true;
    try { await film.play(); } catch(e){ theater.classList.remove("dim"); playButton(() => { theater.classList.add("dim"); film.play(); }); }
  } else if (ytId){
    await ytReady;
    if (!yt){
      const holder = document.createElement("div"); holder.id = "yt"; screen.prepend(holder);
      yt = new YT.Player("yt", { videoId: ytId, playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
        events: { onReady: e => e.target.playVideo(), onStateChange: e => {
          if (e.data === 1) theater.classList.add("dim");
          if (e.data === 0) onFilmEnd();
        }}});
    } else yt.playVideo();
  }
}
function stopFilm(){
  if (film && !film.paused) film.pause();
  if (yt && yt.pauseVideo) yt.pauseVideo();
  theater.classList.remove("open", "dim");
}
async function runScreening(id){
  theater.classList.remove("open", "dim");
  if (film){ film.currentTime = 0; film.controls = false; }
  await wait(1400); if (id !== runId) return;
  theater.classList.add("open");
  await wait(2900); if (id !== runId) return;
  if (film || ytId) startFilm();
}
async function onFilmEnd(){
  const id = runId;
  theater.classList.remove("dim");
  await wait(800); if (id !== runId) return;
  theater.classList.remove("open");
  await wait(3000); if (id !== runId) return;
  await fade(true);
  if (id === runId) location.hash = "credits";
}

/* ---------- 크레딧 ---------- */
$("#crTitle").textContent = C.title;
$("#crSynopsis").textContent = C.synopsis;
$("#crInfo").innerHTML = (C.info || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
$("#crBody").innerHTML = (C.credits || []).map(d => `
  <section class="c-section"><h3>${esc(d.dept)}${d.en ? `<small>${esc(d.en)}</small>` : ""}</h3>
  <div class="people">${(d.people || []).map(p => `
    <article class="person">
      <div class="name">${esc(p.name)}</div>
      ${p.roles && p.roles.length ? `<div class="roles">${p.roles.map(r => `<span>${esc(r)}</span>`).join("")}</div>` : ""}
      ${p.work && p.work.length ? `<ul>${p.work.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    </article>`).join("")}</div></section>`).join("");

const roll = $("#roll"), rollInner = $("#rollInner");
let rollAnim;
$("#rollBtn").onclick = () => {
  rollInner.innerHTML = [`<div><h2 style="font-size:40px">${esc(C.title)}</h2><div class="r-role">${esc(C.titleEn)}</div></div>`]
    .concat((C.credits || []).map(d => `<div><div class="r-dept">${esc(d.dept)}</div>${(d.people || []).map(p => `<div class="r-name">${esc(p.name)}</div><div class="r-role">${esc((p.roles || []).join(" · "))}</div>`).join("")}</div>`))
    .concat(`<div class="r-role">${esc(C.event)}</div>`).join("");
  roll.classList.add("on");
  const h = rollInner.offsetHeight + innerHeight;
  rollAnim = rollInner.animate([{ transform: "translateY(0)" }, { transform: `translateY(-${h}px)` }], { duration: h * 22, easing: "linear" });
  rollAnim.onfinish = closeRoll;
};
function closeRoll(){ if (rollAnim) rollAnim.cancel(); roll.classList.remove("on"); }
$("#rollClose").onclick = closeRoll;
addEventListener("keydown", e => { if (e.key === "Escape" && roll.classList.contains("on")) closeRoll(); });

route();
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const C = window.CONFIG;
const vp = document.getElementById("viewport");
let renderer, scene, camera, controls, current, rim, started = false, wire = false;
const HOME = { dist: 4.2, height: 1.4, target: new THREE.Vector3(0, 1, 0) };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

window.initViewer = function(){
  if (started){ resize(); return; }
  started = true;
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  vp.prepend(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x100c0e);
  scene.fog = new THREE.Fog(0x100c0e, 8, 18);
  camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 1.2; controls.maxDistance = 10;
  controls.enablePan = false;
  controls.autoRotate = !reduce; controls.autoRotateSpeed = 1.6;
  document.getElementById("autoRot").setAttribute("aria-pressed", String(!reduce));

  scene.add(new THREE.HemisphereLight(0xf1e8d6, 0x2a1418, 0.7));
  const key = new THREE.DirectionalLight(0xfff1dc, 2.2);
  key.position.set(3, 5, 4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
  Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xc9d6ff, 0.5); fill.position.set(-4, 2, 2); scene.add(fill);
  rim = new THREE.DirectionalLight(0xd1a85e, 0); rim.position.set(0, 3, -5); scene.add(rim);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.45 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.18, 0.08, 64), new THREE.MeshStandardMaterial({ color: 0x1d1518, roughness: 0.6, metalness: 0.2 }));
  ped.position.y = -0.04; ped.receiveShadow = true; scene.add(ped);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.14, 0.008, 8, 128), new THREE.MeshBasicMaterial({ color: 0xd1a85e }));
  ring.rotation.x = Math.PI / 2; scene.add(ring);
  const tick = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.12, 3), new THREE.MeshBasicMaterial({ color: 0xd1a85e }));
  tick.rotation.x = Math.PI / 2; tick.position.set(0, 0.01, 1.3); scene.add(tick);

  buildTabs(); selectCharacter(0); setupUI();
  addEventListener("resize", resize); resize();
  renderer.setAnimationLoop(loop);
};

function resize(){
  if (!renderer) return;
  const w = vp.clientWidth, h = vp.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = "100%"; renderer.domElement.style.height = "100%";
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
const angleOut = document.getElementById("angleOut");
function loop(){
  controls.update();
  const a = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  angleOut.textContent = Math.round(((a * 180 / Math.PI) + 360) % 360) + "°";
  renderer.render(scene, camera);
}
function frame(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  obj.scale.multiplyScalar(2 / Math.max(size.y, size.x * 0.8, 0.001));
  box.setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= box.min.y;
  obj.traverse(m => { if (m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
}
function home(){ controls.target.copy(HOME.target); camera.position.set(0, HOME.height, HOME.dist); controls.update(); }
function setView(deg){
  const d = camera.position.distanceTo(controls.target);
  if (deg === "top") camera.position.set(0.001, controls.target.y + d, 0.001);
  else { const r = deg * Math.PI / 180; camera.position.set(Math.sin(r) * d, HOME.height, Math.cos(r) * d); }
  setAuto(false);
}
function setModel(obj){
  if (current) scene.remove(current);
  current = obj; frame(obj); scene.add(obj); applyWire(); home();
  document.getElementById("loading").hidden = true;
}
function selectCharacter(i){
  const ch = C.characters[i];
  document.getElementById("chName").textContent = ch.name;
  document.getElementById("chDesc").textContent = ch.desc;
  document.querySelectorAll("#chTabs button").forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)));
  if (ch.file){
    document.getElementById("loading").hidden = false;
    new GLTFLoader().load(ch.file, g => setModel(g.scene), undefined, () => setModel(placeholder(i)));
  } else setModel(placeholder(i));
}
function buildTabs(){
  const box = document.getElementById("chTabs");
  box.innerHTML = C.characters.map((c, i) => `<button type="button" aria-pressed="false">${c.name}<span style="font-family:var(--mono);font-size:11px;opacity:.6">${String(i + 1).padStart(2, "0")}</span></button>`).join("");
  box.querySelectorAll("button").forEach((b, i) => b.onclick = () => selectCharacter(i));
}
function placeholder(i){
  const tint = [0x6a1625, 0x24405e, 0x3d5a2a][i % 3];
  const g = new THREE.Group();
  const cloth = new THREE.MeshStandardMaterial({ color: tint, roughness: 0.7 });
  const skin = new THREE.MeshStandardMaterial({ color: 0xe9c9a8, roughness: 0.6 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a1214, roughness: 0.5 });
  const brass = new THREE.MeshStandardMaterial({ color: 0xd1a85e, roughness: 0.3, metalness: 0.8 });
  const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); g.add(m); return m; };
  add(new THREE.CapsuleGeometry(0.11, 0.55, 6, 16), dark, -0.14, 0.4, 0);
  add(new THREE.CapsuleGeometry(0.11, 0.55, 6, 16), dark, 0.14, 0.4, 0);
  add(new THREE.CapsuleGeometry(0.3, 0.5, 8, 24), cloth, 0, 1.05, 0);
  add(new THREE.TorusGeometry(0.3, 0.04, 8, 32), brass, 0, 0.88, 0, Math.PI / 2);
  add(new THREE.CapsuleGeometry(0.08, 0.5, 6, 16), cloth, -0.4, 1.05, 0, 0, 0, 0.25);
  add(new THREE.CapsuleGeometry(0.08, 0.5, 6, 16), cloth, 0.4, 1.05, 0, 0, 0, -0.25);
  add(new THREE.SphereGeometry(0.075, 16, 16), skin, -0.48, 0.74, 0);
  add(new THREE.SphereGeometry(0.075, 16, 16), skin, 0.48, 0.74, 0);
  add(new THREE.SphereGeometry(0.3, 32, 32), skin, 0, 1.68, 0);
  const hair = add(new THREE.SphereGeometry(0.32, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), dark, 0, 1.7, -0.02); hair.rotation.x = -0.25;
  add(new THREE.SphereGeometry(0.035, 12, 12), dark, -0.1, 1.7, 0.27);
  add(new THREE.SphereGeometry(0.035, 12, 12), dark, 0.1, 1.7, 0.27);
  const cape = add(new THREE.PlaneGeometry(0.62, 0.95, 1, 6), new THREE.MeshStandardMaterial({ color: 0x2a0a10, side: THREE.DoubleSide, roughness: 0.9 }), 0, 0.98, -0.3, 0.12);
  const pos = cape.geometry.attributes.position;
  for (let k = 0; k < pos.count; k++){ const y = pos.getY(k); pos.setZ(k, -Math.pow((0.47 - y) * 0.35, 2)); }
  cape.geometry.computeVertexNormals();
  add(new THREE.BoxGeometry(0.04, 0.8, 0.02), new THREE.MeshStandardMaterial({ color: 0xcfd3d8, metalness: 0.9, roughness: 0.25 }), 0.2, 1.05, -0.36, 0, 0, 0.5);
  add(new THREE.BoxGeometry(0.2, 0.04, 0.05), brass, 0.36, 0.72, -0.36, 0, 0, 0.5);
  return g;
}
function applyWire(){ if (current) current.traverse(m => { if (m.isMesh) [].concat(m.material).forEach(mt => { if ("wireframe" in mt) mt.wireframe = wire; }); }); }
function setAuto(on){ controls.autoRotate = on; document.getElementById("autoRot").setAttribute("aria-pressed", String(on)); }
function setupUI(){
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view === "top" ? "top" : +b.dataset.view));
  document.getElementById("resetCam").onclick = home;
  document.getElementById("autoRot").onclick = () => setAuto(!controls.autoRotate);
  document.getElementById("lightBtn").onclick = e => { const on = rim.intensity === 0; rim.intensity = on ? 3 : 0; e.currentTarget.setAttribute("aria-pressed", String(on)); };
  document.getElementById("wireBtn").onclick = e => { wire = !wire; applyWire(); e.currentTarget.setAttribute("aria-pressed", String(wire)); };
  renderer.domElement.addEventListener("pointerdown", () => setAuto(false));
}
if (location.hash === "#character") window.initViewer();
</script>
</body>
